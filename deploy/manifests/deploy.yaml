apiVersion: v1
kind: Namespace
metadata:
  name: prober-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prober-controller
  namespace: prober-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prober-role
rules:
# watch HTTPRoutes and update annotations/finalizers
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['httproutes']
  verbs: ['get', 'list', 'watch', 'update', 'patch']
- apiGroups: ['gateway.networking.k8s.io']
  resources: ['httproutes/finalizers']
  verbs: ['update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prober-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prober-role
subjects:
- kind: ServiceAccount
  name: prober-controller
  namespace: prober-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prober-leader-election
  namespace: prober-system
rules:
- apiGroups: ['coordination.k8s.io']
  resources: ['leases']
  verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
- apiGroups: [""]
  resources: ['events']
  verbs: ['create', 'patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prober-leader-election-binding
  namespace: prober-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prober-leader-election
subjects:
- kind: ServiceAccount
  name: prober-controller
  namespace: prober-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober-controller
  namespace: prober-system
  labels:
    app: prober
    app.kubernetes.io/name: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prober
    spec:
      serviceAccountName: prober-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: ghcr.io/cilindrox/probe-controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - '--leader-elect'
        envFrom:
        - secretRef:
            name: prober-config
            optional: true
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ['ALL']
---
apiVersion: v1
kind: Secret
metadata:
  name: prober-config
  namespace: prober-system
type: Opaque
stringData:
  EXTERNAL_API_TOKEN: 'my-secret-token'
